<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прогноз погоды</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">
  <div class="weather">
    <h1 class="weather__title">Прогноз погоды</h1>
    <div class="weather__search">
      <input type="text" class="weather__input" placeholder="Введите город">
      <button class="weather__clear" type="button">✕</button>
    </div>
    <button class="weather__submit" type="button">Узнать погоду</button>
    <div class="weather__result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
